<main class="pgwrap"><div class="box"><img src="/assets/images/logo/mark.png" alt=""><h1>Verify Email</h1><p>Enter the parent or guardian’s email to start the 2026/2027 application.</p>
<form id="f"><label for="e">Parent email address</label><input id="e" type="email" placeholder="parent@example.com" required><button class="btn" id="b" disabled>Send OTP Code</button></form><div class="note" id="n"></div><p style="margin-top:18px;font-size:13px">Need help? Call <a href="tel:0268161182" style="color:var(--blue)">0268 161 182</a></p></div></main>
<script>const e=document.getElementById('e'),b=document.getElementById('b');e.oninput=()=>b.disabled=!e.checkValidity()||!e.value;document.getElementById('f').onsubmit=x=>{x.preventDefault();document.getElementById('n').textContent='OTP sending is not connected yet. A backend email service is needed before applications can go live.'}</script></body></html>
