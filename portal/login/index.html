<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/assets/images/logo/mark.png"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><title>Portal Login | The Eden School</title></head><body><div class="split">
<aside class="side"><a href="/"><img src="/assets/images/logo/logo.png" alt="The Eden School"></a><div><h2>Excellentia · <em>Academica</em></h2><p>Sign in to your portal to access results, resources and school updates.</p></div><small>The Eden School · East Legon, Accra</small></aside>
<div class="form"><form id="f"><h1>Portal Login</h1><p style="color:var(--mute);font-size:14px;margin:4px 0 8px">Staff, students and parents — one login for everyone.</p>
<label for="e">Email</label><input id="e" type="email" required autocomplete="username"><label for="p">Password</label><div class="pw"><input id="p" type="password" required autocomplete="current-password"><button type="button" id="s">Show</button></div>
<button class="btn" style="width:100%;justify-content:center;margin-top:20px;padding:14px">Sign In</button><div class="note" id="n"></div><p style="text-align:center;font-size:13px;margin-top:14px;color:var(--mute)">Applying for admission? <a href="/admissions" style="color:var(--blue);font-weight:600">Start an application</a></p></form></div></div>
<script>const p=document.getElementById('p');document.getElementById('s').onclick=function(){const h=p.type=='password';p.type=h?'text':'password';this.textContent=h?'Hide':'Show'};document.getElementById('f').onsubmit=x=>{x.preventDefault();document.getElementById('n').textContent='Portal sign-in is not connected yet. It needs the school’s portal or an authentication service.'}</script></body></html>
